<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>收集兑换 · NFC纪念章</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    background: #1a1a2e;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif;
  }

  /* Phone frame */
  .phone {
    width: 390px;
    height: 844px;
    background: #f5f5f5;
    border-radius: 0;
    overflow: hidden;
    position: relative;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6), inset 0 0 0 2px #333;
  }

  /* Status bar */
  .status-bar {
    height: 44px;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    font-size: 12px;
    font-weight: 600;
    color: #000;
  }
  .status-bar .time { font-size: 15px; font-weight: 700; }
  .status-icons { display: flex; gap: 4px; align-items: center; font-size: 11px; }

  /* Nav bar */
  .nav-bar {
    height: 48px;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    border-bottom: 0.5px solid #e8e8e8;
    position: relative;
  }
  .nav-title { font-size: 17px; font-weight: 600; color: #000; }
  .nav-icons { position: absolute; right: 16px; display: flex; gap: 8px; }
  .nav-icon {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: #f0f0f0;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; cursor: pointer;
  }

  /* Page content */
  .page {
    position: absolute;
    top: 92px; left: 0; right: 0;
    bottom: 60px;
    overflow-y: auto;
    padding: 16px;
    transition: opacity 0.4s, transform 0.4s;
  }
  .page.hidden { opacity: 0; pointer-events: none; transform: translateX(30px); }

  /* Main card */
  .card {
    background: #fff;
    border-radius: 0;
    padding: 28px 20px 24px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }

  .card-desc {
    text-align: center;
    font-size: 18px;
    font-weight: 700;
    color: #1a1a1a;
    line-height: 1.5;
    margin-bottom: 28px;
  }

  /* Medal grid */
  .medal-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px 12px;
    margin-bottom: 28px;
  }

  .medal-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
  }

  .medal-circle {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    position: relative;
    -webkit-filter: grayscale(1) brightness(0.75);
    filter: grayscale(1) brightness(0.75);
    -webkit-transition: -webkit-filter 1.2s ease;
    transition: filter 1.2s ease;
  }

  .medal-item.lit .medal-circle {
    -webkit-filter: grayscale(0) brightness(1);
    filter: grayscale(0) brightness(1);
    -webkit-animation: colorReveal 1.2s ease forwards;
    animation: colorReveal 1.2s ease forwards;
  }

  .medal-item.lit .medal-circle::after {
    animation: glow 1.5s ease-out forwards;
  }

  @-webkit-keyframes colorReveal {
    0%   { -webkit-filter: grayscale(1) brightness(0.75);  transform: scale(1); }
    25%  { -webkit-filter: grayscale(0.6) brightness(1.1); transform: scale(1.08); }
    55%  { -webkit-filter: grayscale(0) brightness(1.5);   transform: scale(1.13); }
    78%  { -webkit-filter: grayscale(0) brightness(1.05);  transform: scale(0.96); }
    100% { -webkit-filter: grayscale(0) brightness(1);     transform: scale(1); }
  }
  @keyframes colorReveal {
    0%   { filter: grayscale(1) brightness(0.75);  transform: scale(1); }
    25%  { filter: grayscale(0.6) brightness(1.1); transform: scale(1.08); }
    55%  { filter: grayscale(0) brightness(1.5);   transform: scale(1.13); }
    78%  { filter: grayscale(0) brightness(1.05);  transform: scale(0.96); }
    100% { filter: grayscale(0) brightness(1);     transform: scale(1); }
  }

  .medal-circle::after {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,215,0,0.6) 0%, transparent 70%);
    opacity: 0;
  }

  @keyframes glow {
    0%   { opacity: 0.8; transform: scale(0.9); }
    50%  { opacity: 0.6; transform: scale(1.3); }
    100% { opacity: 0; transform: scale(1.5); }
  }

  /* NFC ripple on tap */
  .medal-item:active .medal-circle { transform: scale(0.93); }

  .medal-name {
    font-size: 12px;
    color: #666;
    font-weight: 500;
    transition: color 0.4s;
  }
  .medal-item.lit .medal-name { color: #333; font-weight: 600; }

  .medal-img {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    object-fit: cover;
    display: block;
  }

  /* Action button */
  .btn {
    width: 100%;
    height: 52px;
    border-radius: 0;
    font-size: 17px;
    font-weight: 600;
    border: none;
    cursor: pointer;
    transition: all 0.3s ease;
    letter-spacing: 2px;
  }
  .btn-disabled {
    background: #d0d0d0;
    color: #fff;
    pointer-events: none;
  }
  .btn-active {
    background: #111;
    color: #fff;
  }
  .btn-active:active { transform: scale(0.97); opacity: 0.9; }

  /* Bottom tab bar */
  .tab-bar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 60px;
    background: #fff;
    border-top: 0.5px solid #e8e8e8;
    display: flex;
    align-items: center;
  }
  .tab-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    cursor: pointer;
    padding-bottom: 4px;
  }
  .tab-icon { font-size: 20px; color: #999; }
  .tab-label { font-size: 10px; color: #999; }
  .tab-item.active .tab-icon,
  .tab-item.active .tab-label { color: #1a1a1a; }
  .tab-item.active .tab-icon-ring {
    width: 22px; height: 22px;
    border: 2px solid #1a1a1a;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }

  /* QR page */
  .qr-card {
    background: #fff;
    border-radius: 0;
    padding: 40px 32px 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }

  .qr-wrap {
    width: 220px;
    height: 220px;
    position: relative;
    transition: opacity 0.4s;
  }
  .qr-wrap.used { opacity: 0.25; }

  .qr-canvas {
    width: 220px;
    height: 220px;
  }

  .qr-desc {
    font-size: 15px;
    color: #333;
    text-align: center;
    line-height: 1.6;
    font-weight: 500;
  }
  .qr-desc.used { color: #999; }
  .qr-time { font-size: 14px; color: #999; margin-top: 4px; }

  /* NFC demo control */
  .demo-bar {
    background: rgba(255,255,255,0.08);
    border-radius: 0;
    padding: 12px 16px;
    margin-top: 12px;
    text-align: center;
  }
  .demo-label {
    font-size: 11px;
    color: rgba(255,255,255,0.5);
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .demo-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,255,255,0.15);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 20px;
    border-radius: 0;
    cursor: pointer;
    border: 1px solid rgba(255,255,255,0.25);
    transition: background 0.2s;
  }
  .demo-btn:hover { background: rgba(255,255,255,0.25); }
  .demo-btn:active { transform: scale(0.96); }
  .nfc-pulse {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #4ade80;
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(1.4); }
  }

  /* Page label */
  .page-hint {
    font-size: 10px;
    color: rgba(255,255,255,0.3);
    text-align: center;
    margin-top: 8px;
    letter-spacing: 0.5px;
  }

  /* Progress indicator */
  .progress-bar-wrap {
    height: 4px;
    background: #f0f0f0;
    border-radius: 0;
    margin-bottom: 20px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #f0a500, #e05800);
    border-radius: 0;
    transition: width 0.5s ease;
  }
  .progress-label {
    font-size: 12px;
    color: #999;
    text-align: right;
    margin-top: -16px;
    margin-bottom: 16px;
  }

  /* Confetti overlay */
  .confetti-container {
    position: absolute;
    top: 92px; left: 0; right: 0; bottom: 60px;
    pointer-events: none;
    overflow: hidden;
    z-index: 10;
  }
  .confetti-piece {
    position: absolute;
    width: 8px; height: 8px;
    top: -10px;
    opacity: 0;
    border-radius: 0;
    animation: confettiFall 1.2s ease-in forwards;
  }
  @keyframes confettiFall {
    0%   { opacity: 1; transform: translateY(0) rotate(0deg); }
    100% { opacity: 0; transform: translateY(400px) rotate(720deg); }
  }

  /* QR scan button */
  .scan-btn {
    background: transparent;
    border: 1px solid #ddd;
    border-radius: 0;
    padding: 6px 14px;
    font-size: 11px;
    color: #999;
    cursor: pointer;
    margin-top: -8px;
  }
  .scan-btn:hover { background: #f5f5f5; }
</style>
</head>

<script>
  const MEDALS = ['人鱼MOKOKO','航海LABUBU','LABUBU水手','ZIMOMO船长','瞭望手YAYA','落锚手TYCOCO'];
  const STORAGE_KEY = 'nfc_medal_lit';
  const VERIFIED_KEY = 'nfc_medal_verified';

  // Restore persisted state across NFC taps (page loads)
  let litSet = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'));
  let litCount = litSet.size;
  let qrVerified = localStorage.getItem(VERIFIED_KEY) === '1';

  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify([...litSet]));
  }

  function tapMedal(idx) {
    if (litSet.has(idx) || qrVerified) return;
    litSet.add(idx);
    litCount++;
    saveState();

    const item = document.getElementById('medal-' + idx);
    item.classList.add('lit');

    updateProgress();

    if (litCount === 6) {
      setTimeout(() => {
        triggerConfetti();
        document.getElementById('redeem-btn').className = 'btn btn-active';
        document.getElementById('nfc-btn').textContent = '全部点亮 ✓';
        document.getElementById('nfc-btn').style.background = 'rgba(74,222,128,0.2)';
        document.getElementById('page-hint').textContent = '🎉 六枚全亮！点击「兑换」领取二维码';
      }, 400);
    }
  }

  // Each real NFC tap opens this page → auto-collect next unlit medal
  function nfcTapOnLoad() {
    if (qrVerified) return;
    const params = new URLSearchParams(location.search);
    const medalParam = params.get('medal');
    const idx = medalParam !== null ? parseInt(medalParam) : -1;

    if (idx >= 0 && idx < 6) {
      // 指定碰哪枚就点亮哪枚
      if (!litSet.has(idx)) {
        tapMedal(idx);
        document.getElementById('page-hint').textContent =
          '📡 NFC 碰触：' + MEDALS[idx] + ' 已点亮 (' + litCount + '/6)';
      } else {
        document.getElementById('page-hint').textContent =
          MEDALS[idx] + ' 已经收集过啦 (' + litCount + '/6)';
      }
    }
  }

  function simulateNFC() {
    // 演示按钮：依次点亮
    if (litCount >= 6) return;
    for (let i = 0; i < 6; i++) {
      if (!litSet.has(i)) {
        tapMedal(i);
        document.getElementById('page-hint').textContent =
          '📡 NFC 碰触：' + MEDALS[i] + ' 已点亮 (' + litCount + '/6)';
        break;
      }
    }
  }

  function updateProgress() {
    const pct = (litCount / 6 * 100).toFixed(0);
    document.getElementById('progress-fill').style.width = pct + '%';
    document.getElementById('progress-label').textContent = litCount + ' / 6';
  }

  function goToQR() {
    if (litCount < 6) return;
    document.getElementById('page-collect').classList.add('hidden');
    document.getElementById('page-qr').classList.remove('hidden');
    document.getElementById('page-hint').textContent = '出示二维码至兑换点核销';
  }

  function backToCollect() {
    document.getElementById('page-qr').classList.add('hidden');
    document.getElementById('page-collect').classList.remove('hidden');
  }

  function simulateVerify() {
    if (qrVerified) return;
    qrVerified = true;

    // Gray out QR
    document.getElementById('qr-wrap').classList.add('used');

    // Update text
    const desc = document.getElementById('qr-desc');
    desc.classList.add('used');
    desc.textContent = '该兑换码已兑换完成';

    const timeEl = document.getElementById('qr-time');
    timeEl.style.display = 'block';
    timeEl.textContent = '兑换时间：2026-12-13';

    // Gray out button
    const btn = document.getElementById('download-btn');
    btn.className = 'btn btn-disabled';
    btn.textContent = '下载';

    // Hide verify hint
    document.getElementById('verify-hint').style.display = 'none';

    localStorage.setItem(VERIFIED_KEY, '1');
    document.getElementById('page-hint').textContent = '✅ 兑换完成，二维码已核销';
  }

  function resetDemo() {
    localStorage.removeItem(STORAGE_KEY);
    localStorage.removeItem(VERIFIED_KEY);
    location.reload();
  }

  // ── QR Code Generator (pure canvas, no library) ──
  function drawQR() {
    const canvas = document.getElementById('qr-canvas');
    const ctx = canvas.getContext('2d');
    const size = 220;
    ctx.clearRect(0, 0, size, size);

    // White background
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, size, size);

    // Generate pseudo-random but stable QR-like pattern
    const seed = 20261213;
    const modules = 29; // 29x29 grid
    const mod = size / modules;

    function seededRand(i, j) {
      const n = (i * 97 + j * 37 + seed) % 100;
      return n < 45;
    }

    ctx.fillStyle = '#000000';

    for (let i = 0; i < modules; i++) {
      for (let j = 0; j < modules; j++) {
        // Skip finder patterns area
        const inFinder =
          (i < 8 && j < 8) ||
          (i < 8 && j >= modules - 8) ||
          (i >= modules - 8 && j < 8);

        // Timing pattern
        const isTiming = (i === 6 || j === 6) && !inFinder;

        if (inFinder || isTiming) continue;

        if (seededRand(i, j)) {
          ctx.fillRect(j * mod + 1, i * mod + 1, mod - 1, mod - 1);
        }
      }
    }

    // Draw finder patterns (top-left, top-right, bottom-left)
    [[0,0],[0,modules-7],[modules-7,0]].forEach(([r,c]) => {
      drawFinder(ctx, c * mod, r * mod, mod);
    });

    // Timing pattern
    ctx.fillStyle = '#000';
    for (let k = 8; k < modules - 8; k++) {
      if (k % 2 === 0) {
        ctx.fillRect(k * mod + 1, 6 * mod + 1, mod-1, mod-1);
        ctx.fillRect(6 * mod + 1, k * mod + 1, mod-1, mod-1);
      }
    }

    // Alignment pattern (center-ish)
    drawAlignment(ctx, 16 * mod, 16 * mod, mod);
  }

  function drawFinder(ctx, x, y, mod) {
    // Outer 7x7 black
    ctx.fillStyle = '#000';
    for (let i = 0; i < 7; i++) {
      for (let j = 0; j < 7; j++) {
        const ring = i === 0 || i === 6 || j === 0 || j === 6;
        const inner = i >= 2 && i <= 4 && j >= 2 && j <= 4;
        if (ring || inner) {
          ctx.fillRect(x + j * mod + 0.5, y + i * mod + 0.5, mod, mod);
        }
      }
    }
    // White middle ring
    ctx.fillStyle = '#fff';
    for (let i = 1; i <= 5; i++) {
      for (let j = 1; j <= 5; j++) {
        if (i === 1 || i === 5 || j === 1 || j === 5) {
          ctx.fillRect(x + j * mod + 0.5, y + i * mod + 0.5, mod, mod);
        }
      }
    }
    ctx.fillStyle = '#000';
  }

  function drawAlignment(ctx, x, y, mod) {
    ctx.fillStyle = '#000';
    for (let i = -2; i <= 2; i++) {
      for (let j = -2; j <= 2; j++) {
        const edge = Math.abs(i) === 2 || Math.abs(j) === 2;
        const center = i === 0 && j === 0;
        if (edge || center) {
          ctx.fillRect(x + j * mod + 0.5, y + i * mod + 0.5, mod, mod);
        }
      }
    }
    ctx.fillStyle = '#fff';
    for (let i = -1; i <= 1; i++) {
      for (let j = -1; j <= 1; j++) {
        if (!(i === 0 && j === 0)) {
          ctx.fillRect(x + j * mod + 0.5, y + i * mod + 0.5, mod, mod);
        }
      }
    }
    ctx.fillStyle = '#000';
  }

  // ── Init on page load ──
  function initOnLoad() {
    // Restore visual state — no animation, just re-apply lit class
    litSet.forEach(idx => {
      const item = document.getElementById('medal-' + idx);
      item.classList.add('lit');
      // Skip re-playing the reveal animation on restore
      const circle = item.querySelector('.medal-circle');
      if (circle) circle.style.animation = 'none';
    });
    updateProgress();

    if (litCount === 6) {
      document.getElementById('redeem-btn').className = 'btn btn-active';
      document.getElementById('nfc-btn').textContent = '全部点亮 ✓';
      document.getElementById('nfc-btn').style.background = 'rgba(74,222,128,0.2)';
    }

    // 只有 URL 带 ?tap=1 时（NFC 芯片跳转）才收集新纪念章
    const isTap = new URLSearchParams(location.search).get('tap') === '1';
    if (isTap) {
      nfcTapOnLoad();
      // 清除参数，防止刷新重复触发
      history.replaceState(null, '', location.pathname);
    }
  }

  window.addEventListener('DOMContentLoaded', initOnLoad);

  // ── Confetti ──
  function triggerConfetti() {
    const layer = document.getElementById('confetti-layer');
    const colors = ['#ffd700','#ff6b9d','#4ade80','#60a5fa','#f97316','#a78bfa'];
    for (let i = 0; i < 40; i++) {
      const el = document.createElement('div');
      el.className = 'confetti-piece';
      el.style.cssText = `
        left: ${Math.random() * 100}%;
        background: ${colors[Math.floor(Math.random() * colors.length)]};
        width: ${4 + Math.random() * 8}px;
        height: ${4 + Math.random() * 8}px;
        animation-delay: ${Math.random() * 0.5}s;
        animation-duration: ${0.8 + Math.random() * 0.8}s;
        border-radius: ${Math.random() > 0.5 ? '50%' : '2px'};
      `;
      layer.appendChild(el);
      el.addEventListener('animationend', () => el.remove());
    }
  }
</script>
